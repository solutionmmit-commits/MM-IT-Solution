<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="lines" width="1080" height="38" patternUnits="userSpaceOnUse">
      <line x1="0" y1="38" x2="1080" y2="38" stroke="#1E3A46" stroke-opacity="0.07" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1080" height="1080" fill="#FBF6EA"/>
  <rect width="1080" height="1080" fill="url(#lines)"/>

  <!-- outer border -->
  <rect x="26" y="26" width="1028" height="1028" fill="none" stroke="#1E3A46" stroke-width="4"/>

  <!-- stamp badge -->
  <g transform="translate(895,150) rotate(10)">
    <circle r="72" fill="#CE9A3E" stroke="#1E3A46" stroke-width="4"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="34" fill="#FBF6EA">MM</text>
  </g>

  <!-- brand -->
  <text x="80" y="175" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#3E6E63" letter-spacing="1">পঞ্চগড় সদর, পঞ্চগড়</text>

  <text x="78" y="270" font-family="Georgia, serif" font-weight="700" font-size="70" fill="#1E3A46">MM IT Solution</text>

  <text x="80" y="330" font-family="Georgia, serif" font-size="34" fill="#B8402F" font-weight="700">সকল অনলাইন ও অফলাইন আইটি সেবা, একসাথে</text>

  <!-- divider dashed -->
  <line x1="80" y1="380" x2="1000" y2="380" stroke="#1E3A46" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- services receipt box -->
  <rect x="80" y="420" width="920" height="380" fill="#F2EADA" stroke="#1E3A46" stroke-width="3"/>

  <!-- service rows: 2 columns x 3 rows -->
  <g font-family="Georgia, serif" fill="#1E3A46">
    <!-- col 1 -->
    <text x="120" y="480" font-size="24" font-weight="700" fill="#B8402F">০১</text>
    <text x="170" y="480" font-size="26" font-weight="700">ফটো স্টুডিও</text>

    <text x="120" y="545" font-size="24" font-weight="700" fill="#B8402F">০২</text>
    <text x="170" y="545" font-size="26" font-weight="700">ফটোকপি</text>

    <text x="120" y="610" font-size="24" font-weight="700" fill="#B8402F">০৩</text>
    <text x="170" y="610" font-size="26" font-weight="700">কম্পোজিং</text>

    <text x="120" y="675" font-size="24" font-weight="700" fill="#B8402F">০৪</text>
    <text x="170" y="675" font-size="26" font-weight="700">প্রিন্টিং</text>

    <!-- col 2 -->
    <text x="580" y="480" font-size="24" font-weight="700" fill="#B8402F">০৫</text>
    <text x="630" y="480" font-size="26" font-weight="700">অনলাইন আবেদন</text>

    <text x="580" y="545" font-size="24" font-weight="700" fill="#B8402F">০৬</text>
    <text x="630" y="545" font-size="26" font-weight="700">চাকরির আবেদন</text>

    <text x="580" y="610" font-size="24" font-weight="700" fill="#B8402F">০৭</text>
    <text x="630" y="610" font-size="26" font-weight="700">NID / জন্মনিবন্ধন</text>

    <text x="580" y="675" font-size="24" font-weight="700" fill="#B8402F">০৮</text>
    <text x="630" y="675" font-size="26" font-weight="700">আরও অনলাইন সেবা</text>
  </g>

  <line x1="120" y1="730" x2="960" y2="730" stroke="#1E3A46" stroke-width="1.5" stroke-dasharray="1 8" stroke-linecap="round"/>
  <text x="120" y="775" font-family="Georgia, serif" font-size="22" fill="#3E6E63">দ্রুত • নির্ভরযোগ্য • সাশ্রয়ী মূল্যে সেবা</text>

  <!-- contact strip -->
  <rect x="80" y="860" width="920" height="150" fill="#1E3A46"/>
  <text x="120" y="915" font-family="Georgia, serif" font-size="28" fill="#FBF6EA" font-weight="700">☎ ০১XXX-XXXXXX</text>
  <text x="120" y="960" font-family="Georgia, serif" font-size="24" fill="#D8E2E4">[দোকানের ঠিকানা], পঞ্চগড়</text>
  <text x="120" y="995" font-family="Georgia, serif" font-size="22" fill="#CE9A3E" font-weight="700">facebook.com/mmitsolution21</text>

</svg>
